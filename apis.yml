name: SideCare
description: >-
  SideCare is a French insurtech and HR-benefits platform (operated by Hoggo)
  that helps companies build, deploy, and manage their employee health policy.
  It brokers and administers collective health insurance (mutuelle) and
  disability cover (prévoyance), comparing more than 15,500 contracts, and adds
  a free SIRH/HR and quality-of-life (QVT) layer, a digital clinic with
  telemedicine, and the SideCard prepaid health-expense card that advances up to
  €1,500/month. Over 7,800 companies and 100,000+ insured individuals use the
  platform. SideCare runs a "Sign in with SideCare" OpenID Connect identity
  provider and integrates with payroll/HRIS tools such as PayFit, Lucca, and
  Nibelis. Backed by Partech.
